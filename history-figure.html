/* ---------------- 状态 ---------------- */
let ans = [], idx = 0, result = null, unlocked = false;
const app = document.getElementById('app');
const LS = 'hf_state_v1';

const AB='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // 32 字符，去掉易混的 0 O 1 I
function hash(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return h>>>0}
function sum(body){const h=hash(body+CONFIG.SALT);return AB[h&31]+AB[(h>>>5)&31]}
function codeOK(raw){
  const c=(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(c.length!==10||c.slice(0,2)!=='LS')return false;
  return c.slice(8)===sum(c.slice(0,8));
}

/* 计分 */
function score(){
  const raw=[0,0,0,0];                       // 每维选 a 的次数 0..5
  ans.forEach((v,i)=>{ if(v==='a') raw[Q[i].d]++ });
  const code = DIMS.map((d,i)=> raw[i]>=3 ? d.a : d.b).join('');
  // 二项分布理论概率：C(5,k)/32，四维相乘
  const C=[1,5,10,10,5,1];
  let p=1; raw.forEach(k=> p *= C[k]/32);
  return {code, raw, p};
}
function pctText(p){
  const v=p*100;
  if(v>=1) return v.toFixed(1)+'%';
  if(v>=0.1) return v.toFixed(2)+'%';
  if(v>=0.001) return v.toFixed(3)+'%';
  // 极小概率直接给出「多少分之一」，避免显示成 0.000%
  return '1 / '+Math.round(1/p).toLocaleString();
}
// 最配 = 翻转 2、4 维（内外互补、冷热互补，底色一致）
function partner(c){const m={W:'N',N:'W',R:'L',L:'R'};return c[0]+m[c[1]]+c[2]+m[c[3]]}
function clash(c){const m={J:'S',S:'J',W:'N',N:'W',P:'X',X:'P',R:'L',L:'R'};return [...c].map(x=>m[x]).join('')}

function dimRow(d,k){
  const left = k;            // 选 a 的次数
  const pct  = Math.round(k/5*100);

  const style = aOn ? `right:50%;width:${w}%` : `left:50%;width:${w}%`;
  return `<div class="dim-row">
    <div class="dim-lab"><span class="${aOn?'on':''}">${d.an}</span><span class="${aOn?'':'on'}">${d.bn}</span></div>
    <div class="dim-track"><div class="dim-mid"></div><div class="dim-fill" style="${style}"></div></div>
    <div class="dim-pct">${aOn?d.an:d.bn} ${Math.max(pct,100-pct)}%</div>

}

/* ---------------- 分享长图（原生 Canvas，无外部依赖） ---------------- */
function draw(f){
  const c=document.getElementById('cv'), g=c.getContext('2d');
  const W=1080;
  const S='"Songti SC","STSong","SimSun",serif';
  const N='"PingFang SC","Microsoft YaHei",sans-serif';
  const cx=W/2;

  // 先排版算出总高，避免人物名或金句变长时底部被裁
  g.font=`36px ${S}`;
  const quoteLines = layout(f.one, 860);
  const totalH = 588 + quoteLines.length*56 + 96 + 4*134 + 260 + 150;

  c.width=W; c.height=Math.round(totalH);      // 设尺寸会清空画布，必须在绘制前
  g.fillStyle='#f4efe6'; g.fillRect(0,0,W,c.height);
  const grd=g.createRadialGradient(W/2,-60,40,W/2,-60,900);
  grd.addColorStop(0,'rgba(201,160,106,.28)'); grd.addColorStop(1,'rgba(201,160,106,0)');
  g.fillStyle=grd; g.fillRect(0,0,W,620);

  g.textAlign='center';

  // 印
  g.strokeStyle='#9c3a2e'; g.lineWidth=4;
  roundRect(g,cx-52,96,104,104,16); g.stroke();
  g.fillStyle='#9c3a2e'; g.font=`46px ${S}`; g.fillText('照见',cx,164);

  g.fillStyle='#6b5f55'; g.font=`26px ${N}`;
  g.fillText('你 骨 子 里 是 哪 个 历 史 人 物',cx,266);

  g.fillStyle='#2b2520'; g.font=`156px ${S}`;
  g.fillText(f.n,cx,440);
  g.fillStyle='#a8743a'; g.font=`40px ${S}`;
  g.fillText(f.t.split('').join(' '),cx,510);

  g.strokeStyle='rgba(168,116,58,.5)'; g.lineWidth=2;
  g.beginPath(); g.moveTo(cx-60,536); g.lineTo(cx+60,536); g.stroke();

  // 金句
  g.fillStyle='#443b33'; g.font=`36px ${S}`;
  quoteLines.forEach((ln,i)=>g.fillText(ln,cx,588+i*56));

  // 四维
  let y=588+quoteLines.length*56+96;
  const dimStart=y;
  g.textAlign='left';
  DIMS.forEach((d,i)=>{
    const k=result.raw[i], aOn=k>=3, pct=Math.max(Math.round(k/5*100),100-Math.round(k/5*100));
    g.font=`28px ${N}`;
    g.fillStyle=aOn?'#2b2520':'#9b9089'; g.fillText(d.an,120,y);
    g.textAlign='right';
    g.fillStyle=aOn?'#9b9089':'#2b2520'; g.fillText(d.bn,960,y);
    g.textAlign='left';
    g.fillStyle='rgba(43,37,32,.08)'; roundRect(g,120,y+18,840,16,8); g.fill();
    const w=840*Math.abs(k/5-0.5);
    const lg=g.createLinearGradient(120,0,960,0);
    lg.addColorStop(0,'#c9a06a'); lg.addColorStop(1,'#a8743a');
    g.fillStyle=lg;
    roundRect(g, aOn ? 540-w : 540, y+18, w, 16, 8); g.fill();
    g.fillStyle='rgba(43,37,32,.22)'; g.fillRect(539,y+14,2,24);
    g.fillStyle='#a8743a'; g.font=`22px ${N}`;
    g.fillText(`${aOn?d.an:d.bn} ${pct}%`,120,y+70);
    y+=134;
  });

  // 罕见度
  y = dimStart + 4*134 + 90;
  g.fillStyle='#2b2520'; roundRect(g,80,y,920,196,28); g.fill();
  g.textAlign='center';
  g.fillStyle='rgba(244,239,230,.6)'; g.font=`24px ${N}`;
  g.fillText('这 套 答 案 的 出 现 概 率',cx,y+68);
  g.fillStyle='#c9a06a'; g.font=`86px ${S}`;
  g.fillText(pctText(result.p),cx,y+156);

  // 底部：编码 + 店铺
  y += 196;
  g.fillStyle='#6b5f55'; g.font=`24px ${N}`;
  g.fillText(`${result.code} · ${DIMS.map((d,i)=>result.raw[i]>=3?d.an:d.bn).join(' · ')}`,cx,y+56);
  g.fillStyle='#a8743a'; g.font=`24px ${N}`;
  g.fillText(CONFIG.SHOP,cx,y+108);

  document.getElementById('shot').src=c.toDataURL('image/png');
  document.getElementById('mask').classList.add('on');
}
/* 按宽度折行，返回每行文字 */
function layout(text,max){
  const c=document.getElementById('cv'), g=c.getContext('2d');
  const lines=[]; let line='';
  for(const ch of text){
    if(g.measureText(line+ch).width>max){ lines.push(line); line=ch }
    else line+=ch;
  }
  if(line) lines.push(line);
  return lines;
}
function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}

/* ---------------- 启动 ---------------- */
if(localStorage.getItem(LS)==='1') unlocked=true;
const urlCode=new URLSearchParams(location.search).get('code');
if(urlCode && codeOK(urlCode)){ unlocked=true; localStorage.setItem(LS,'1'); }
viewCover();
