</script>
<script>
/* ============================================================================
   通用测试引擎
   支持 5 种计分模型：
     axes4   : 4 个二元维度 × 每维 5 题 → 16 种结果（人格类）
     grid9   : 2 个 0-10 维度 × 各 10 题 → 3×3 九宫格（占有欲、控制欲）
     attach4 : 2 个 0-8 维度 × 各 8 题 → 4 种依恋类型
     career  : 6 个能力簇加权 → 排序取前 N（职业适配）
     match   : 双人心答 20 题 → 匹配度百分比（情侣、朋友）
   每个测试只需提供 QUIZ 数据对象，不必改本文件。
============================================================================ */
/* 下面三行不用改，它们读的是文件顶部那个 SETUP 块 */
const _S = (typeof SETUP !== 'undefined' && SETUP) ? SETUP : {};
const CONFIG = {
  MODE: _S.MODE || 'free',
  SALT: _S.SALT || 'shigu-2026',
  BRAND: '照见小馆'
};

const LS_PREFIX = 'shigu_';
let ans = [], idx = 0, result = null, unlocked = false, pass = 0;   // pass: 0=自己 1=猜对方

const app = document.getElementById('app');
const AB = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function fhash(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return h>>>0}
function csum(body){const h=fhash(body+CONFIG.SALT);return AB[h&31]+AB[(h>>>5)&31]}
function codeOK(raw){
  const c=(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(c.length!==10||c.slice(0,2)!=='PX')return false;
  return c.slice(8)===csum(c.slice(0,8));
}

/* ---------------- 计分：按模式分派 ---------------- */
const BINOM = {
  5:[1,5,10,10,5,1],
  10:[1,10,45,120,210,252,210,120,45,10,1],
  8:[1,8,28,56,70,56,28,8,1]
};

function score(){
  const q = QUIZ, m = q.mode;

  if (m === 'axes4' || m === 'attach4'){
    const per = q.questions.length / q.dims.length;      // 5 或 8
    const raw = q.dims.map(()=>0);
    ans.forEach((v,i)=>{ if(v==='a') raw[q.questions[i].d]++ });
    const C = BINOM[per];
    const total = Math.pow(2, per);
    const half = Math.ceil(per/2);

    if (m === 'axes4'){
      const code = q.dims.map((d,i)=> raw[i]>=half ? d.a : d.b).join('');
      let p = 1; raw.forEach(k => p *= C[k]/total);
      return {code, raw, p, mode:m};
    } else {
      // attach4：高低二值，只看是否过半
      const code = q.dims.map((d,i)=> raw[i]>=half ? d.a : d.b).join('');
      let p = 1;
      raw.forEach(k => {
        let s = 0;
        for (let j = half; j <= per; j++) s += C[j];
        p *= (k >= half ? s : (total - s)) / total;
      });
      return {code, raw, p, mode:m};
    }
  }

  if (m === 'grid9'){
    const per = q.questions.length / q.dims.length;      // 10
    const raw = q.dims.map(()=>0);
    ans.forEach((v,i)=>{ if(v==='a') raw[q.questions[i].d]++ });
    const band = k => k <= 3 ? 0 : (k <= 6 ? 1 : 2);
    const code = raw.map(band).join('');
    // 三档概率：0-3 / 4-6 / 7-10 各有 176 / 672 / 176 种组合
    const P = [176/1024, 672/1024, 176/1024];
    const p = raw.reduce((acc,k)=>acc*P[band(k)], 1);
    return {code, raw, bands:raw.map(band), p, mode:m};
  }

  if (m === 'career'){
    const n = q.clusters.length;
    const pts = new Array(n).fill(0);
    ans.forEach((v,i)=>{
      const qq = q.questions[i];
      const w = v === 'a' ? qq.wa : qq.wb;      // 直接给权重下标
      if (typeof w === 'number') pts[w] += 1;
    });
    const tot = pts.reduce((a,b)=>a+b,0) || 1;
    const ranked = pts.map((v,i)=>({i, pct: v/tot*100}))
                       .sort((a,b)=>b.pct-a.pct);
    return {code:'CAREER', raw:pts, ranked, p:null, mode:m};
  }

  if (m === 'match'){
    const halfN = q.questions.length;
    const mine = ans.slice(0, halfN);
    const guess = ans.slice(halfN);
    let same = 0;
    const diff = [];
    mine.forEach((v,i)=>{
      if (v === guess[i]) same++;
      else diff.push(i);
    });
    const pct = Math.round(same / halfN * 100);
    return {code:'MATCH', raw:[same, halfN-same], pct, diff, mode:m};
  }
}

/* ---------------- 共享 UI 片段 ---------------- */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function sec(title, inner){
  return `<div class="sec"><div class="sec-h"><span>${title}</span><i></i></div>${inner}</div>`;
}
function para(t){ return `<div class="para">${t}</div>`; }
function list(items, dark){
  return `<div class="list">${items.map(x=>
    `<div class="li${dark?' dark':''}"><span class="d">${dark?'◇':'◆'}</span><span>${x}</span></div>`).join('')}</div>`;
}
function dimBars(raw){
  const per = QUIZ.questions.length / QUIZ.dims.length;
  return `<div class="dims">${QUIZ.dims.map((d,i)=>{
    const k = raw[i], aOn = k >= Math.ceil(per/2);
    const pct = Math.max(Math.round(k/per*100), 100-Math.round(k/per*100));
    const w = Math.abs(k/per*100-50);
    const style = aOn ? `right:50%;width:${w}%` : `left:50%;width:${w}%`;
    return `<div class="dim-row">
      <div class="dim-lab"><span class="${aOn?'on':''}">${d.an}</span><span class="${aOn?'':'on'}">${d.bn}</span></div>
      <div class="dim-track"><div class="dim-mid"></div><div class="dim-fill" style="${style}"></div></div>
      <div class="dim-pct">${aOn?d.an:d.bn} ${pct}%</div>
    </div>`;
  }).join('')}</div>`;
}
/* 概率 -> 显示文本。极小值改用「1/N」写法，避免显示成 0.000% */
function pctText(p){
  const v = p*100;
  if (v>=1)     return v.toFixed(1)+'%';
  if (v>=0.1)   return v.toFixed(2)+'%';
  if (v>=0.001) return v.toFixed(3)+'%';
  return '1/'+Math.round(1/p).toLocaleString();
}
function rareBox(p){
  if (p == null) return '';
  return sec('罕 见 度', `<div class="rare">
    <div class="t">这 套 答 案 的 出 现 概 率</div>
    <div class="big serif">${pctText(p)}</div>
    <div class="d">理论上每 ${Math.round(1/p).toLocaleString()} 个人里才出现 1 次</div></div>`);
}

/* ---------------- 封面 ---------------- */
function viewCover(){
  const q = QUIZ;
  app.innerHTML = `
  <div class="cover">
    <div class="seal serif">${q.seal || CONFIG.BRAND}</div>
    <h1 class="serif">${q.title}</h1>
    <div class="sub">${q.sub}</div>
    <div class="rule"></div>
    <div class="meta">
      <div><b>${q.meta.a[0]}</b>${q.meta.a[1]}</div>
      <div><b>${q.meta.b[0]}</b>${q.meta.b[1]}</div>
      <div><b>${q.meta.c[0]}</b>${q.meta.c[1]}</div>
    </div>
    <button class="btn serif" id="go">开 始</button>
    <div class="tip">${q.note}<br>${q.footTip || '约 2 分钟 · 答案不上传，只存在你手机里'}</div>
  </div>`;
  document.getElementById('go').onclick = ()=>{ ans=[]; idx=0; pass=0; viewQuiz() };
}

/* ---------------- 答题 ---------------- */
function viewQuiz(){
  const q = QUIZ, isMatch = q.mode === 'match';
  // 匹配型：questions 本身就是题数，每道题答两遍（自己 + 猜对方）
  const halfN = q.questions.length;
  const totalAll = isMatch ? halfN * 2 : halfN;
  const qLocal = (isMatch && idx >= halfN) ? idx - halfN : idx;
  const qq = q.questions[qLocal];
  const n = qLocal + 1;
  const totalQ = halfN;
  const pct = totalAll ? idx / totalAll * 100 : 0;

  const tag = isMatch
    ? (pass===0
        ? `<span class="pass-tag">第一遍 · 你自己的选择</span>`
        : `<span class="pass-tag b">第二遍 · 猜 TA 会怎么选</span>`)
    : '';

  // 右上角提示文字：匹配型显示进度说明，其余显示当前维度
  let sideHint = '';
  if (isMatch) sideHint = pass===0 ? '你的答案' : '你猜 TA 的';
  else if (q.dims && q.dims[qq.d]) sideHint = q.dims[qq.d].desc || '';

  app.innerHTML = `
  <div class="quiz">
    <div class="bar">
      <div class="bar-top"><span><b>${String(n).padStart(2,'0')}</b> / ${totalQ}</span><span>${sideHint}</span></div>
      <div class="track"><div class="fill" style="width:${pct}%"></div></div>
    </div>
    <div class="qbody">
      ${tag}
      <div class="qnum serif">${String(n).padStart(2,'0')}</div>
      <div class="qtext">${qq.t}</div>
      <div class="opts">
        <button class="opt" data-v="a"><span class="mk serif">A</span>${qq.a}</button>
        <button class="opt" data-v="b"><span class="mk serif">B</span>${qq.b}</button>
      </div>
    </div>
    <button class="back" id="bk" ${idx===0?'hidden':''}>← 上一题</button>
  </div>`;

  app.querySelectorAll('.opt').forEach(el=>{
    el.onclick = ()=>{
      el.classList.add('sel');
      ans[idx] = el.dataset.v;
      setTimeout(()=>{
        idx++;
        if (isMatch){
          // 总题数 = 题数 × 2（自己一遍 + 猜对方一遍）
          const totalAll = q.questions.length * 2;
          if (idx === halfN){ pass = 1; viewPassIntro(); }
          else if (idx >= totalAll){ viewResult(); }
          else { viewQuiz(); }
        } else if (idx >= q.questions.length){
          viewResult();
        } else {
          viewQuiz();
        }
      }, 170);
    };
  });
  const bk = document.getElementById('bk');
  if (bk) bk.onclick = ()=>{ idx--; if(isMatch && idx<halfN) pass=0; viewQuiz() };
}

/* 双人测试：两遍之间的过渡页 */
function viewPassIntro(){
  app.innerHTML = `
  <div class="cover">
    <div class="seal serif">双</div>
    <h1 class="serif" style="font-size:32px">第一遍完成</h1>
    <div class="sub" style="margin-top:24px">接下来，请当自己是 TA<br>用 TA 的方式，再选一遍</div>
    <div class="rule"></div>
    <div class="tip" style="max-width:280px;text-align:center;line-height:2.2">
      不用问 TA 的答案，按你的了解猜<br>猜得越准，匹配度越接近真实
    </div>
    <button class="btn serif" id="go2" style="margin-top:36px">继 续</button>
  </div>`;
  document.getElementById('go2').onclick = ()=>{ viewQuiz() };
}

/* ---------------- 结果：按模式分派 ---------------- */
function viewResult(){
  result = score();
  const m = result.mode;
  if (m === 'career') return renderCareer();
  if (m === 'match')  return renderMatch();
  if (m === 'grid9')  return renderGrid9();
  return renderChars();          // axes4 / attach4
}

/* --- 人物/类型型（16 或 4 种） --- */
function renderChars(){
  const f = QUIZ.outcomes[result.code];
  if (!f) { app.innerHTML = '<div class="cover"><h1>数据缺失</h1><div class="sub">code: '+result.code+'</div></div>'; return; }
  const showFull = unlocked || CONFIG.MODE === 'free';
  const cps = f.pair ? QUIZ.outcomes[f.pair] : null;
  const bad = f.clash ? QUIZ.outcomes[f.clash] : null;

  const head = `<div class="res">
    <div class="res-kicker">你 的 结 果</div>
    <div class="res-name serif">${f.n}</div>
    <div class="res-title serif">${f.t}</div>
    <div class="res-code">${QUIZ.codeLabel ? QUIZ.codeLabel(result) : result.code}</div>
    <div class="quote serif">${f.one}</div>`;

  const fullRows = `
    ${sec('类 型 说 明', para(f.bio))}
    ${sec(QUIZ.dimTitle || '四 维 坐 标', dimBars(result.raw))}
    ${sec(QUIZ.upTitle || '你 的 高 光', list(f.up))}
    ${sec(QUIZ.dnTitle || '你 的 暗 面', list(f.dn, true))}
    ${cps ? sec(QUIZ.cpTitle || '关 系 参 照', `<div class="cps">
      <div class="cp"><div class="t">${cps.t||'相 似'}</div><div class="n serif">${cps.n}</div><div class="s">${f.pairWhy||'和你同频的那一类'}</div></div>
      <div class="cp bad"><div class="t">${bad?bad.t||'相 反':'相 反'}</div><div class="n serif">${bad?bad.n:'—'}</div><div class="s">${f.clashWhy||'和你最容易磨合的那一类'}</div></div></div>`) : ''}
    ${rareBox(result.p)}
    ${f.tail ? sec(QUIZ.tailTitle || '写 在 最 后', `<div class="para serif" style="font-size:17px">${f.tail}</div>`) : ''}
    <div class="foot">
      <button class="btn gold block serif" id="save">生成长图 · 保存分享</button>
      <button class="btn ghost block serif" id="again" style="margin-top:12px">重 新 测 一 次</button>
      <div class="note">${QUIZ.disclaimer}</div>
    </div></div>`;

  const wall = `
    ${sec('类 型 说 明', `<div class="locked"><div class="blur">${para(f.bio)}</div></div>`)}
    <div class="wall">
      <h3 class="serif">完整报告还有更多内容</h3>
      <p>${QUIZ.dimTitle||'四维坐标'} · ${QUIZ.upTitle||'你的高光'} · ${QUIZ.dnTitle||'你的暗面'}<br>关系参照 · 答案罕见度 · 可保存长图</p>
      ${CONFIG.MODE==='code' ? `
        <div class="codebox"><input id="ci" placeholder="输入兑换码" maxlength="14" autocomplete="off">
        <button class="btn gold serif" style="padding:14px 24px;letter-spacing:2px" id="cb">解锁</button></div>
        <div class="err" id="ce"></div>`
      : `<div class="tip" style="font-size:13px;line-height:2">在小红书店铺拍下完整版<br>付款后自动发货，立刻可看</div>`}
    </div>
    <div class="foot"><button class="btn ghost block serif" id="again">重 新 测 一 次</button>
      <div class="note">${QUIZ.disclaimer}</div></div></div>`;

  app.innerHTML = head + (showFull ? fullRows : wall);
  window.scrollTo(0,0);
  bindFooter(f);
}

/* --- 九宫格型（占有欲 / 控制欲） --- */
function renderGrid9(){
  const o = QUIZ.outcomes[result.code];
  const showFull = unlocked || CONFIG.MODE === 'free';
  const [b0, b1] = result.bands;
  const L = QUIZ.levels;

  const head = `<div class="res">
    <div class="res-kicker">你 的 结 果</div>
    <div class="res-name serif">${o.n}</div>
    <div class="res-title serif">${o.t}</div>
    <div class="res-code">${QUIZ.dims[0].an} ${result.raw[0]}/10 · ${QUIZ.dims[1].an} ${result.raw[1]}/10</div>
    <div class="quote serif">${o.one}</div>`;

  const grid = `<div class="dims">${QUIZ.dims.map((d,i)=>{
    const k = result.raw[i];
    const band = result.bands[i];
    const bandName = L[i].names[band];
    return `<div class="dim-row">
      <div class="dim-lab"><span class="${band===2?'on':''}">${L[i].hi}</span><span class="${band===0?'on':''}">${L[i].lo}</span></div>
      <div class="dim-track"><div class="dim-mid"></div>
        <div class="dim-fill" style="${k>=5?`right:50%;width:${(k-5)*10}%`:`left:50%;width:${(5-k)*10}%`}"></div>
      </div>
      <div class="dim-pct">${k}/10 · ${bandName}</div>
    </div>`;
  }).join('')}</div>`;

  const fullRows = `
    ${sec('这 是 什 么 样 的 状 态', para(o.bio))}
    ${sec(QUIZ.bandTitle || '两 条 轴', grid)}
    ${sec('关 系 里 的 你', list(o.up))}
    ${sec('需 要 小 心 的 地 方', list(o.dn, true))}
    ${o.advice ? sec('如 果 想 调 整', para(o.advice)) : ''}
    ${rareBox(result.p)}
    <div class="foot">
      <button class="btn gold block serif" id="save">生成长图 · 保存分享</button>
      <button class="btn ghost block serif" id="again" style="margin-top:12px">重 新 测 一 次</button>
      <div class="note">${QUIZ.disclaimer}</div></div></div>`;

  const wall = `
    ${sec('这 是 什 么 样 的 状 态', `<div class="locked"><div class="blur">${para(o.bio)}</div></div>`)}
    <div class="wall"><h3 class="serif">完整报告还有更多内容</h3>
      <p>两条轴的具体分数 · 关系里的你 · 需要小心的地方<br>调整建议 · 答案罕见度 · 可保存长图</p>
      ${CONFIG.MODE==='code'?`<div class="codebox"><input id="ci" placeholder="输入兑换码" maxlength="14">
        <button class="btn gold serif" style="padding:14px 24px" id="cb">解锁</button></div><div class="err" id="ce"></div>`
        :`<div class="tip" style="font-size:13px;line-height:2">在小红书店铺拍下完整版<br>付款后自动发货，立刻可看</div>`}
    </div>
    <div class="foot"><button class="btn ghost block serif" id="again">重 新 测 一 次</button>
      <div class="note">${QUIZ.disclaimer}</div></div></div>`;

  app.innerHTML = head + (showFull ? fullRows : wall);
  window.scrollTo(0,0);
  bindFooter(o);
}

/* --- 职业适配型 --- */
function renderCareer(){
  const showFull = unlocked || CONFIG.MODE === 'free';
  const top = result.ranked;
  const best = QUIZ.clusters[top[0].i];

  const head = `<div class="res">
    <div class="res-kicker">你 的 结 果</div>
    <div class="res-name serif" style="font-size:clamp(34px,10vw,50px)">${best.n}</div>
    <div class="res-title serif">${best.t}</div>
    <div class="quote serif">${best.one}</div>`;

  // 条长按最高分归一，避免低分被视觉放大
  const maxPct = Math.max(...top.map(r=>r.pct), 1);
  const ranks = `<div class="ranks">${top.slice(0, showFull?6:1).map((r,i)=>{
    const c = QUIZ.clusters[r.i];
    return `<div class="rk${i===0?' top':''}">
      <div class="rk-h"><span class="nm serif">${i+1}. ${c.n}</span><span class="pc">${r.pct.toFixed(1)}%</span></div>
      <div class="rk-bar"><i style="width:${Math.max(4, r.pct/maxPct*100)}%"></i></div>
      <div class="rk-d">${c.d}</div></div>`;
  }).join('')}</div>`;

  const fullRows = `
    ${sec('为 什 么 是 它', para(best.bio))}
    ${sec('六 个 方 向 的 匹 配 度', ranks)}
    ${sec('你 的 优 势', list(best.up))}
    ${sec('可 能 的 坑', list(best.dn, true))}
    ${sec('具 体 可 以 做 什 么', list(best.jobs))}
    <div class="foot">
      <button class="btn gold block serif" id="save">生成长图 · 保存分享</button>
      <button class="btn ghost block serif" id="again" style="margin-top:12px">重 新 测 一 次</button>
      <div class="note">${QUIZ.disclaimer}</div></div></div>`;

  const wall = `
    ${sec('第 二 名 开 始', `<div class="locked"><div class="blur">${ranks}</div></div>`)}
    <div class="wall"><h3 class="serif">完整报告还有更多内容</h3>
      <p>六个方向的完整匹配度排行<br>你的优势 · 可能的坑 · 具体可以做什么</p>
      ${CONFIG.MODE==='code'?`<div class="codebox"><input id="ci" placeholder="输入兑换码" maxlength="14">
        <button class="btn gold serif" style="padding:14px 24px" id="cb">解锁</button></div><div class="err" id="ce"></div>`
        :`<div class="tip" style="font-size:13px;line-height:2">在小红书店铺拍下完整版<br>付款后自动发货，立刻可看</div>`}
    </div>
    <div class="foot"><button class="btn ghost block serif" id="again">重 新 测 一 次</button>
      <div class="note">${QUIZ.disclaimer}</div></div></div>`;

  app.innerHTML = head + (showFull ? fullRows : wall);
  window.scrollTo(0,0);
  bindFooter(best);
}

/* --- 匹配度型 --- */
function renderMatch(){
  const showFull = unlocked || CONFIG.MODE === 'free';
  const pct = result.pct;
  const tier = QUIZ.tiers.find(t => pct >= t.min) || QUIZ.tiers[QUIZ.tiers.length-1];

  const head = `<div class="res">
    <div class="res-kicker">你 们 的 匹 配 度</div>
    <div class="score-wrap">
      <div class="score-big serif">${pct}<small>%</small></div>
      <div class="score-lab">${tier.n}</div>
    </div>
    <div class="score-bar"><i style="width:${pct}%"></i></div>
    <div class="quote serif" style="margin-top:30px">${tier.one}</div>`;

  const diffs = result.diff.slice(0, 6).map(i=>{
    const q = QUIZ.questions[i];
    return `<div class="li dark"><span class="d">◇</span><span><b>${q.t}</b><br>${q.note || '这一题你们选得不一样。'}</span></div>`;
  }).join('');

  const fullRows = `
    ${sec('你 们 的 相 处 模 式', para(tier.bio))}
    ${sec('最 合 拍 的 地 方', list(tier.up))}
    ${sec('最 容 易 卡 住 的 地 方', list(tier.dn, true))}
    ${result.diff.length
      ? sec(`分 歧 的 ${result.diff.length} 个 点`, `<div class="list">${diffs}</div>`)
      : sec('分 歧', para('这 20 道题你们没有一个分歧点。要么是真的默契，要么是有一方在猜的时候太乐观了——后者更常见，哈哈。'))}
    ${tier.advice ? sec('给 你 的 一 句 话', `<div class="para serif" style="font-size:17px">${tier.advice}</div>`) : ''}
    <div class="foot">
      <button class="btn gold block serif" id="save">生成长图 · 保存分享</button>
      <button class="btn ghost block serif" id="again" style="margin-top:12px">重 新 测 一 次</button>
      <div class="note">${QUIZ.disclaimer}</div></div></div>`;

  const wall = `
    ${sec('你 们 的 相 处 模 式', `<div class="locked"><div class="blur">${para(tier.bio)}</div></div>`)}
    <div class="wall"><h3 class="serif">完整报告还有更多内容</h3>
      <p>最合拍的地方 · 最容易卡住的地方<br>${result.diff.length} 个分歧点的逐条分析 · 可保存长图</p>
      ${CONFIG.MODE==='code'?`<div class="codebox"><input id="ci" placeholder="输入兑换码" maxlength="14">
        <button class="btn gold serif" style="padding:14px 24px" id="cb">解锁</button></div><div class="err" id="ce"></div>`
        :`<div class="tip" style="font-size:13px;line-height:2">在小红书店铺拍下完整版<br>付款后自动发货，立刻可看</div>`}
    </div>
    <div class="foot"><button class="btn ghost block serif" id="again">重 新 测 一 次</button>
      <div class="note">${QUIZ.disclaimer}</div></div></div>`;

  app.innerHTML = head + (showFull ? fullRows : wall);
  window.scrollTo(0,0);
  bindFooter(tier);
}

function bindFooter(f){
  const ag = document.getElementById('again');
  if (ag) ag.onclick = ()=>{ ans=[]; idx=0; pass=0; viewCover() };
  const sv = document.getElementById('save');
  if (sv) sv.onclick = ()=>drawShare(f);
  const cb = document.getElementById('cb');
  if (cb){
    cb.onclick = ()=>{
      const v = document.getElementById('ci').value;
      if (codeOK(v)){ unlocked = true; localStorage.setItem(LS_PREFIX+QUIZ.id, '1'); viewResult(); }
      else document.getElementById('ce').textContent = '兑换码不正确，请检查后重新输入';
    };
    document.getElementById('ci').addEventListener('keydown', e=>{ if(e.key==='Enter') cb.click() });
  }
}

/* ---------------- 分享长图 ---------------- */
function drawShare(f){
  const c = document.getElementById('cv'), g = c.getContext('2d');
  const W = 1080, cx = W/2;
  const S = '"Songti SC","STSong","SimSun",serif';
  const N = '"PingFang SC","Microsoft YaHei",sans-serif';
  const m = QUIZ.mode;

  const titleTxt = m==='match' ? (result.pct + '%') : (f.n || '');
  const subTxt   = m==='match' ? (QUIZ.tiers.find(t=>result.pct>=t.min)||{n:''}).n
                               : (f.t || '');
  const quoteTxt = m==='match' ? (QUIZ.shareQuote ? QUIZ.shareQuote(result) : (f.one||'')) : (f.one || QUIZ.shareQuote && QUIZ.shareQuote(result) || '');

  g.font = `36px ${S}`;
  const quoteLines = layout(g, quoteTxt, 860);

  // 三个区块高度只在这里算一次，绘制处全部复用，保证画布高度和实际绘制严格一致
  const Y0 = 588 + quoteLines.length*56 + 96;            // 维度区起始
  const dimN = (QUIZ.dims||[]).length;
  const bodyH = m==='career' ? 20
              : m==='match'  ? 10
              : (dimN ? (dimN-1)*134 + 130 : 0);          // 末条基线 + 文字高 + 卡间距
  const cardH = m==='career' ? 300 : (m==='match' ? 150 : 196);
  const totalH = Y0 + bodyH + cardH + 152;
  c.width = W; c.height = Math.round(totalH);

  g.fillStyle = '#f4efe6'; g.fillRect(0,0,W,c.height);
  const grd = g.createRadialGradient(cx,-60,40,cx,-60,900);
  grd.addColorStop(0,'rgba(201,160,106,.28)'); grd.addColorStop(1,'rgba(201,160,106,0)');
  g.fillStyle = grd; g.fillRect(0,0,W,620);

  g.textAlign = 'center';
  g.strokeStyle = '#9c3a2e'; g.lineWidth = 4;
  roundRect(g, cx-52, 96, 104, 104, 16); g.stroke();
  g.fillStyle = '#9c3a2e'; g.font = `46px ${S}`;
  g.fillText(QUIZ.seal || CONFIG.BRAND, cx, 164);

  g.fillStyle = '#6b5f55'; g.font = `26px ${N}`;
  g.fillText(QUIZ.shareTitle || QUIZ.title.replace(/<[^>]+>/g,''), cx, 266);

  g.fillStyle = '#2b2520'; g.font = `${m==='match'?170:156}px ${S}`;
  g.fillText(titleTxt, cx, m==='match'?430:440);
  g.fillStyle = '#a8743a'; g.font = `40px ${S}`;
  g.fillText(String(subTxt).split('').join(' '), cx, 510);

  g.strokeStyle = 'rgba(168,116,58,.5)'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(cx-60,536); g.lineTo(cx+60,536); g.stroke();

  g.fillStyle = '#443b33'; g.font = `36px ${S}`;
  quoteLines.forEach((ln,i)=>g.fillText(ln, cx, 588+i*56));

  let y = Y0;

  // 维度条（人物型 / 九宫格型）
  if (m==='axes4' || m==='attach4' || m==='grid9'){
    const per = QUIZ.questions.length / QUIZ.dims.length;
    g.textAlign = 'left';
    QUIZ.dims.forEach((d,i)=>{
      const k = result.raw[i];
      const aOn = k >= Math.ceil(per/2);
      const pct = Math.max(Math.round(k/per*100), 100-Math.round(k/per*100));
      g.font = `28px ${N}`;
      g.fillStyle = aOn?'#2b2520':'#9b9089'; g.fillText(d.an, 120, y);
      g.textAlign = 'right';
      g.fillStyle = aOn?'#9b9089':'#2b2520'; g.fillText(d.bn, 960, y);
      g.textAlign = 'left';
      g.fillStyle = 'rgba(43,37,32,.08)'; roundRect(g,120,y+18,840,16,8); g.fill();
      const w = 840*Math.abs(k/per-0.5);
      const lg = g.createLinearGradient(120,0,960,0);
      lg.addColorStop(0,'#c9a06a'); lg.addColorStop(1,'#a8743a');
      g.fillStyle = lg;
      roundRect(g, aOn ? 540-w : 540, y+18, w, 16, 8); g.fill();
      g.fillStyle = 'rgba(43,37,32,.22)'; g.fillRect(539,y+14,2,24);
      g.fillStyle = '#a8743a'; g.font = `22px ${N}`;
      g.fillText(`${aOn?d.an:d.bn} ${pct}%`, 120, y+70);
      y += 134;
    });
    y = Y0 + bodyH;                             // 与上方 totalH 的算法严格对齐
  } else if (m==='career'){
    y += 20;
  } else if (m==='match'){
    y += 10;
  }

  // 罕见度 or 职业排行 or 匹配条
  if (m==='career'){
    g.fillStyle = '#2b2520'; roundRect(g,80,y,920,300,28); g.fill();
    g.textAlign = 'center';
    g.fillStyle = 'rgba(244,239,230,.55)'; g.font = `22px ${N}`;
    g.fillText('六 个 方 向 的 匹 配 度', cx, y+50);
    result.ranked.slice(0,4).forEach((r,i)=>{
      const c2 = QUIZ.clusters[r.i];
      g.textAlign = 'left';  g.fillStyle = 'rgba(244,239,230,.9)'; g.font = `26px ${N}`;
      g.fillText(c2.n, 130, y+110+i*52);
      g.fillStyle = 'rgba(244,239,230,.2)';
      roundRect(g, 330, y+94+i*52, 470, 12, 6); g.fill();
      g.fillStyle = '#c9a06a';
      roundRect(g, 330, y+94+i*52, 470*Math.min(1, r.pct/40), 12, 6); g.fill();
      g.textAlign = 'right'; g.fillStyle = '#c9a06a'; g.font = `24px ${N}`;
      g.fillText(r.pct.toFixed(0)+'%', 950, y+110+i*52);
      g.textAlign = 'left';
    });
    y += 300;
  } else if (m==='match'){
    g.fillStyle = '#2b2520'; roundRect(g,80,y,920,150,28); g.fill();
    g.textAlign = 'center';
    g.fillStyle = 'rgba(244,239,230,.55)'; g.font = `22px ${N}`;
    g.fillText(`${QUIZ.questions.length} 道 题`, cx, y+58);
    g.fillStyle = '#c9a06a'; g.font = `30px ${S}`;
    g.fillText(`对 上 了 ${result.raw[0]} 题`, cx, y+106);
    y += 150;
  } else {
    const p = result.p;
    g.fillStyle = '#2b2520'; roundRect(g,80,y,920,196,28); g.fill();
    g.textAlign = 'center';
    g.fillStyle = 'rgba(244,239,230,.6)'; g.font = `24px ${N}`;
    g.fillText('这 套 答 案 的 出 现 概 率', cx, y+68);
    g.fillStyle = '#c9a06a'; g.font = `86px ${S}`;
    g.fillText(pctText(p), cx, y+156);
    y += 196;
  }

  y += 4;
  g.fillStyle = '#6b5f55'; g.font = `24px ${N}`;
  g.fillText(QUIZ.shareFoot || '', cx, y+56);
  g.fillStyle = '#a8743a'; g.font = `24px ${N}`;
  g.fillText(QUIZ.shop || '', cx, y+108);

  document.getElementById('shot').src = c.toDataURL('image/png');
  document.getElementById('mask').classList.add('on');
}

function layout(g, text, max){
  const lines = []; let line = '';
  for (const ch of text){
    if (g.measureText(line+ch).width > max){ lines.push(line); line = ch; }
    else line += ch;
  }
  if (line) lines.push(line);
  return lines;
}
function roundRect(g,x,y,w,h,r){
  g.beginPath(); g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}

/* ---------------- 启动 ---------------- */
if (_S.SHOP) QUIZ.shop = _S.SHOP;          // 顶部 SETUP.SHOP 覆盖长图底部文案
if (localStorage.getItem(LS_PREFIX+QUIZ.id) === '1') unlocked = true;
const urlCode = new URLSearchParams(location.search).get('code');
if (urlCode && codeOK(urlCode)){ unlocked = true; localStorage.setItem(LS_PREFIX+QUIZ.id,'1'); }
viewCover();

</script>
